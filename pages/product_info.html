<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Produto</title>
        <link rel="stylesheet" href="../base.css" />
        <link rel="stylesheet" href="product_info.css" />
        <script src="../scripts/users.js" defer></script>
        <script src="../scripts/products.js" defer></script>
        <script src="../scripts/cart.js" defer></script>
        <script src="product_info.js" defer></script>
        <script src="header.js" defer></script>
    </head>
    <body>
        <header>
            <div id="header-tools-left">
                <button class="neutral-button" onclick="back_button()">Voltar</button>
            </div>
            <div id="header-tools-right">

            <button class="neutral-button" id="cart-button">
                🛒
            </button>
            <p id="username">
                Name
            </p>
            </div>
        </header>
        <main>
            <div id="product-card">
                <div id="first-row">
                    <img id="product-image" />
                    <div id="product-texts">
                        <p id="product-name">Sem nome</p>
                        <p id="product-price">Sem preço</p>
                        <p id="product-category">Sem Categoria</p>
                        <div>
                            <button class="green-button">Comprar</button>
                            <button class="blue-button" id="add-product-in-cart-button">
                                Adicionar no carrinho
                            </button>
                        </div>
                    </div>
                </div>
                <p id="product-description">Sem descrição</p>
                <button class="red-button">Denunciar Produto</button>
            </div>
        </main>
    </body>
</html>
